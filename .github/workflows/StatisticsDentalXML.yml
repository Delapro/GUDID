name: 3) Statistics Dental-Xml files

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["2) Join Dental-Xml files"]
    types: [completed]
    branches: [main]
    
permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Find latest successful Join run
        id: findrun
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runs = @(gh run list `
            --workflow JoinDentalXml.yml `
            --branch "${{ github.ref_name }}" `
            --status success `
            --limit 1 `
            --json databaseId | ConvertFrom-Json)

          if ($runs.Count -eq 0) {
            throw "Kein erfolgreicher Join-Workflow gefunden."
          }

          "run_id=$($runs[0].databaseId)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download joined Dental XML
        uses: actions/download-artifact@v5
        with:
          name: Gudid-Dental
          run-id: ${{ steps.findrun.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: Dental-xml-Artefakt

      - name: Check XML file
        shell: pwsh
        run: |
          $file = './Dental-xml-Artefakt/Gudid-Dental.xml'
          if (-not (Test-Path $file -PathType Leaf)) {
            throw "Gudid-Dental.xml fehlt!"
          }
          Get-Item $file | Select-Object Name, Length

      - name: Statistics on Dental XML files
        shell: pwsh
        run: ./StatisticsDentalXML.PS1

      - name: Upload Statistics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Dental-Statistics
          path: Statistics-Output/*.csv
          if-no-files-found: warn
          
